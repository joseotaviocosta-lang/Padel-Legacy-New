<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" role="img" aria-labelledby="pl-horizontal-title">
  <title id="pl-horizontal-title">Padel Legacy</title>
  <!--
    Versao horizontal: mark + wordmark, para header/splash/documentos. Usa a
    mesma fonte do app (Inter, ver token font-heading em src/index.css) e o
    motivo "degraus ascendentes" (legado/progressao) sob o wordmark. Manter
    este comentario em ASCII puro (ver logo-mark.svg para o motivo).
  -->
  <rect x="3" y="3" width="94" height="94" rx="22" fill="#98E822"/>
  <rect x="30" y="22" width="13" height="56" rx="4" fill="#0A0D14"/>
  <path
    fill-rule="evenodd"
    fill="#0A0D14"
    d="M40,22 H56 A10,10 0 0 1 66,32 V44 A10,10 0 0 1 56,54 H40 A10,10 0 0 1 30,44 V32 A10,10 0 0 1 40,22 Z
       M49,32 H53 A5,5 0 0 1 58,37 V39 A5,5 0 0 1 53,44 H49 A5,5 0 0 1 44,39 V37 A5,5 0 0 1 49,32 Z"
  />
  <circle cx="56" cy="78" r="9" fill="#0A0D14"/>

  <text x="118" y="46" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="0.5" fill="#F4F7FA">PADEL</text>
  <text x="118" y="78" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="2.5" fill="#98E822">LEGACY</text>

  <!-- degraus ascendentes: legado/progressao -->
  <rect x="300" y="70" width="10" height="8" rx="2" fill="#98E822" opacity="0.55"/>
  <rect x="313" y="60" width="10" height="18" rx="2" fill="#98E822" opacity="0.75"/>
  <rect x="326" y="48" width="10" height="30" rx="2" fill="#98E822"/>
</svg>
